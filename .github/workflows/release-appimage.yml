# Build a portable x86_64 AppImage on Ubuntu 24.04 (GTK 4.14 / libadwaita 1.5)
# and attach it to the GitHub Release for the matching tag.
#
# audio2go uses Adw.ToolbarView, Adw.Dialog, Gtk.FileDialog, and
# Gio.ApplicationFlags.DEFAULT_FLAGS, which are not in Ubuntu 22.04's stack.
#
# Usage:
#   1. Bump APPLICATION_VERSION in src/audio2go/config.py (and pyproject.toml).
#   2. git tag v0.1.1 && git push origin v0.1.1
#   3. This workflow builds and uploads:
#        audio2go-VERSION-x86_64.AppImage
#        audio2go-VERSION-x86_64.AppImage.zsync
#
# Manual dry-run (artifact only, no release upload):
#   Actions → Release AppImage → Run workflow

name: Release AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            binutils \
            pkg-config \
            python3 \
            python3-pip \
            python3-gi \
            python3-gi-cairo \
            python3-mutagen \
            python3-pil \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgtk-4-1 \
            libgtk-4-dev \
            libadwaita-1-0 \
            libadwaita-1-dev \
            gobject-introspection \
            librsvg2-bin \
            ffmpeg \
            zsync \
            libglib2.0-bin

      - name: Verify tools on PATH
        run: |
          set -euo pipefail
          python3 --version
          for t in python3 gcc curl ffmpeg zsyncmake glib-compile-schemas; do
            command -v "$t"
          done
          python3 - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Adw, Gio, Gtk
          assert hasattr(Adw, "ToolbarView"), "libadwaita too old (need ToolbarView)"
          assert hasattr(Adw, "Dialog"), "libadwaita too old (need Dialog)"
          assert hasattr(Gtk, "FileDialog"), "GTK too old (need FileDialog)"
          print("gi ok", Gtk.MAJOR_VERSION, Gtk.MINOR_VERSION)
          PY

      - name: Check tag matches APPLICATION_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^APPLICATION_VERSION = '\\(.*\\)'/\\1/p" src/audio2go/config.py | head -1)"
          TAG="${GITHUB_REF_NAME#v}"
          echo "config version=${VERSION} tag=${TAG}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "error: src/audio2go/config.py APPLICATION_VERSION (${VERSION}) must match tag (${TAG})" >&2
            exit 1
          fi

      - name: Build AppImage
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./appimage/build-appimage.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audio2go-appimage
          path: |
            dist/audio2go-*-x86_64.AppImage
            dist/audio2go-*-x86_64.AppImage.zsync
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/audio2go-*-x86_64.AppImage dist/audio2go-*-x86_64.AppImage.zsync)
          if [ "${#assets[@]}" -lt 1 ]; then
            echo "error: no AppImage assets in dist/" >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          title="audio2go ${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$title" \
              --generate-notes
          fi
          gh release view "$tag"
