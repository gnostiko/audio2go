[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio2go"
version = "0.1.1"
description = "Sync and transcode a music library for portable devices"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "gnostiko" }]
keywords = [
  "audio",
  "music",
  "sync",
  "transcode",
  "gnome",
  "gtk",
  "libadwaita",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = [
  "mutagen>=1.47",
  "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/gnostiko/audio2go"
Issues = "https://github.com/gnostiko/audio2go/issues"

[project.gui-scripts]
audio2go = "audio2go.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audio2go = ["*.ui"]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]
ignore = [
  "E402",
  "E501",
  "SIM105",
  "SIM108",
  "RUF001",
  "RUF002",
  "RUF003",
  "SIM102",
  "RUF012",
]

[tool.basedpyright]
include = ["src"]
exclude = ["**/__pycache__", "build", "dist", ".tools"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
reportMissingModuleSource = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "none"
reportAttributeAccessIssue = "none"
reportAny = "none"
reportUndefinedVariable = "error"
reportOptionalMemberAccess = "warning"
reportArgumentType = "warning"
reportAssignmentType = "warning"
reportGeneralTypeIssues = "warning"
reportPrivateImportUsage = "none"
